services:
  postgres-test:
    image: postgres:17-alpine
    container_name: shopping-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopping_test
    ports:
      - "127.0.0.1:55432:5432"
    # 独立测试卷；stop/start 保留现场，不能用停机即清空的 tmpfs。
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopping_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  test_pgdata:
